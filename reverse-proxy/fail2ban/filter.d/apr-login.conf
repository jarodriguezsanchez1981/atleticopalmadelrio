# Filtro fail2ban: intentos de login / 2FA fallidos o limitados en el log de
# acceso del reverse-proxy (formato combined de nginx). <HOST> es la IP real
# del cliente (el reverse-proxy ve la IP de internet).
[Definition]
failregex = ^<HOST> -.*"POST /api/auth/(login|2fa/verificar) HTTP/[^"]+" (401|429)\b
ignoreregex =

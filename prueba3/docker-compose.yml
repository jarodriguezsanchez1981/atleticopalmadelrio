services:

  db:
    image: mysql:8.0
    container_name: apr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-atletico_palma_intranet}
      MYSQL_USER: ${DB_USER:-apr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apr_pass}
      TZ: Europe/Madrid
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - apr_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - apr_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apr_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://intranet.atleticopalmadelrio.com,https://intranet.atleticopalmadelrio.com,https://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      DB_PASSWORD: ${DB_PASSWORD:-apr_pass}
      JWT_SECRET: ${JWT_SECRET:-7d7857fcd1c3e70182cb1d6de060b3e8639500193c5402f8a2ee5f4e6c056d0f}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin#2026}
    expose:
      - "4000"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    networks:
      - apr_net

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: apr_backend_test
    restart: "no"
    command: npm test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      DB_PASSWORD: ${DB_PASSWORD:-apr_pass}
    cap_drop:
      - ALL
    networks:
      - apr_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: apr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - apr_net

  nginx:
    image: nginx:alpine
    container_name: apr_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-80}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - apr_net

volumes:
  apr_mysql_data:

networks:
  apr_net:
    driver: bridge

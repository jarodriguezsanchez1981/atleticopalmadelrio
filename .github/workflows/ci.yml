name: CI

# Integración continua: en cada push/PR a develop o main se ejecutan los tests
# del backend y del frontend, el build del frontend y una auditoría de
# dependencias (npm audit). El paso bloqueante audita solo las dependencias de
# producción (--omit=dev) y falla si hay una vulnerabilidad CRITICAL en lo que
# realmente se despliega. El paso informativo audita el árbol completo (incluye
# las de desarrollo, p. ej. el runner de tests) a nivel HIGH: queda visible en
# el log pero no bloquea (las HIGH ya las vigila el cron de seguridad y el aviso
# de la intranet).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Escanea el árbol de ficheros (--no-git) con el allowlist de .gitleaks.toml
      # (plantillas .example y fixtures de test están excluidos). Falla si hay
      # un secreto real. La imagen puede fijarse a una versión concreta si hace falta.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact --exit-code 1 -v

  backend:
    name: Backend (tests + auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tests
        run: npm test
      - name: Auditoría de dependencias (árbol completo, HIGH, informativa)
        run: npm audit --audit-level=high || true
      - name: Auditoría de dependencias de producción (bloquea en CRITICAL)
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend (tests + build + auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoría de dependencias (árbol completo, HIGH, informativa)
        run: npm audit --audit-level=high || true
      - name: Auditoría de dependencias de producción (bloquea en CRITICAL)
        run: npm audit --omit=dev --audit-level=critical

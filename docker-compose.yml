services:

  db:
    image: mysql:8.0
    container_name: apr_mysql
    restart: unless-stopped
    # Binary log activo: cada cambio (no solo el volcado diario) queda
    # registrado, para poder restaurar point-in-time junto con el servicio
    # binlog-backup. Purga sola a los 30 días (mismo plazo que DB_DUMP_RETENTION).
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=2592000
      - --sync-binlog=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en tu .env}
      MYSQL_DATABASE: ${DB_NAME:-atletico_palma_intranet}
      MYSQL_USER: ${DB_USER:-apr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
      TZ: Europe/Madrid
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    # Solo las capacidades que necesita el entrypoint de la imagen oficial
    # (arranca como root, ajusta el datadir y baja a usuario mysql).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - apr_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en tu .env}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - apr_net

  # Copia diaria cifrada con age (clave pública backup-key.pub; la privada no
  # está en el servidor). Ver scripts/db-backup.sh, que explica cómo restaurar.
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.db-backup
    container_name: apr_mysql_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-apr_user}
      DB_PASS: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      AGE_RECIPIENTS_FILE: /run/backup-key.pub
      # Destino en S3 (vacío = no se sube). En el EC2: s3://<bucket>/intranet,
      # con el rol de IAM de la instancia (solo s3:PutObject).
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Diario a las 03:00 UTC; conserva 30 días de copias
      BACKUP_HOUR_UTC: 3
      RETENTION_DAYS: 30
    volumes:
      - ./backups:/backups
      - ./backup-key.pub:/run/backup-key.pub:ro
    cap_drop:
      - ALL
    networks:
      - apr_net

  binlog-backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.binlog-backup
    container_name: apr_mysql_binlog_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en tu .env}
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./backups/binlogs:/backups
    cap_drop:
      - ALL
    networks:
      - apr_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apr_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://intranetatleticopalmadelrio.com,https://intranetatleticopalmadelrio.com,https://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en tu .env (ver .env.production.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?Define AES_SECRET_KEY en tu .env (32 bytes hex, ver .env.production.example)}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en tu .env}
      # JSESSIONID de una sesión de rfaf.es abierta en un navegador para el
      # botón "Finalizar Acta" (desde la IP del EC2 RFAF no crea sesiones).
      # Caduca: cuando falle, poner una nueva y recrear el backend.
      RFAF_COOKIE: ${RFAF_COOKIE:-}
    volumes:
      # migrate.js busca database/migrations en la raíz del contenedor
      # (../../../database/migrations desde backend/src/utils); sin este
      # mount, database/migrations/*.sql nunca se aplican en Docker.
      - ./database/migrations:/database/migrations:ro
    expose:
      - "4000"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    networks:
      - apr_net

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: apr_backend_test
    restart: "no"
    command: npm test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
    cap_drop:
      - ALL
    networks:
      - apr_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: apr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Solo en localhost por defecto: en el servidor se entra por el reverse
    # proxy HTTPS. Para probar desde otro dispositivo de la red local,
    # FRONTEND_BIND=0.0.0.0 en el env file.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - apr_net

  # HTTPS público con Let's Encrypt, sin depender de Cloudflare: este nginx
  # atiende 80/443 y reenvía todo a "frontend" (que ya hace de proxy interno
  # hacia el backend). Ver reverse-proxy/init-letsencrypt.sh para el primer
  # certificado; luego el servicio "certbot" los renueva solo.
  reverse-proxy:
    image: nginx:alpine
    container_name: apr_reverse_proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:-intranet.atleticopalmadelrio.com}
    volumes:
      - ./reverse-proxy/templates:/etc/nginx/templates:ro
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt:ro
      - ./reverse-proxy/certbot/www:/var/www/certbot:ro
    networks:
      - apr_net

  certbot:
    image: certbot/certbot
    container_name: apr_certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt
      - ./reverse-proxy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - apr_net

volumes:
  apr_mysql_data:

networks:
  apr_net:
    driver: bridge

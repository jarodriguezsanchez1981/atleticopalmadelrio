# Cada servicio lleva un tope de memoria (mem_limit): son topes, no reservas
# (su suma puede pasar de la RAM del servidor, 2 GB); evitan que uno solo que
# se descontrole tire el servidor entero.

# Logs de cada contenedor con tamaño máximo (3 ficheros de 10 MB): sin esto
# Docker los guarda sin límite y pueden llenar el disco del servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: mysql:8.4
    container_name: apr_mysql
    logging: *logging
    mem_limit: 768m
    restart: unless-stopped
    # Al parar, hasta 60 s para cerrar bien (InnoDB y binlog) antes de que
    # Docker lo mate; por defecto son 10 s.
    stop_grace_period: 60s
    # Binary log activo: cada cambio (no solo el volcado diario) queda
    # registrado, para poder restaurar point-in-time junto con el servicio
    # binlog-backup. Purga sola a los 7 días (mismo plazo que RETENTION_DAYS).
    # (En 8.4 el formato de binlog ya es ROW de forma fija, no hace falta fijarlo.)
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
      - --sync-binlog=1
    # Las contraseñas llegan como ficheros en /run/secrets (ver `secrets:` al
    # final), no como variables: así no se ven con `docker inspect`.
    secrets:
      - mysql_root_password
      - db_password
      - binlog_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_NAME:-atletico_palma_intranet}
      MYSQL_USER: ${DB_USER:-apr_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      # Usuario solo de replicación para binlog-backup (database/init-binlog-user.sh,
      # que solo se ejecuta al crear la BD por primera vez).
      BINLOG_USER: ${BINLOG_USER:-apr_binlog}
      BINLOG_PASSWORD_FILE: /run/secrets/binlog_password
      TZ: Europe/Madrid
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    # Solo las capacidades que necesita el entrypoint de la imagen oficial
    # (arranca como root, ajusta el datadir y baja a usuario mysql).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - apr_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/init-binlog-user.sh:/docker-entrypoint-initdb.d/02-binlog-user.sh:ro
    healthcheck:
      # La contraseña se lee del secreto al ejecutarse ($$ = $ literal), no se
      # escribe en la configuración: así no sale en `docker inspect` ni en la
      # lista de procesos.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mysql_root_password)\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - apr_net

  # Copia diaria cifrada con age (clave pública backup-key.pub; la privada no
  # está en el servidor). Ver scripts/db-backup.sh, que explica cómo restaurar.
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.db-backup
    container_name: apr_mysql_backup
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-apr_user}
      DB_PASS_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      AGE_RECIPIENTS_FILE: /run/backup-key.pub
      # Destino en S3 (vacío = no se sube). En el EC2: s3://<bucket>/intranet,
      # con el rol de IAM de la instancia (solo s3:PutObject).
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Diario a las 03:00 UTC; conserva 7 días de copias
      BACKUP_HOUR_UTC: 3
      RETENTION_DAYS: 7
    secrets:
      - db_password
    volumes:
      - ./backups:/backups
      - ./backup-key.pub:/run/backup-key.pub:ro
    cap_drop:
      - ALL
    networks:
      - apr_net

  binlog-backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.binlog-backup
    container_name: apr_mysql_binlog_backup
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Usuario propio con permisos solo de replicación, no root.
      BINLOG_USER: ${BINLOG_USER:-apr_binlog}
      BINLOG_PASSWORD_FILE: /run/secrets/binlog_password
      DB_HOST: db
      DB_PORT: 3306
      RETENTION_DAYS: 7
    secrets:
      - binlog_password
    volumes:
      - ./backups/binlogs:/backups
    cap_drop:
      - ALL
    networks:
      - apr_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apr_backend
    logging: *logging
    restart: unless-stopped
    # Un init mínimo (tini) como PID 1: recoge los procesos de Python de RFAF
    # que queden huérfanos y pasa bien las señales al parar.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Solo en local: true quita el 2FA del login (se ignora si NODE_ENV no es development)
      SIN_2FA: ${SIN_2FA:-false}
      PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://intranetatleticopalmadelrio.com,https://intranetatleticopalmadelrio.com,https://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      # Secretos como ficheros (src/config/env.js los lee de *_FILE).
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      AES_SECRET_KEY_FILE: /run/secrets/aes_secret_key
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD_FILE: /run/secrets/seed_admin_password
      # JSESSIONID de una sesión de rfaf.es abierta en un navegador para el
      # botón "Finalizar Acta" (desde la IP del EC2 RFAF no crea sesiones).
      # Caduca: cuando falle, poner una nueva y recrear el backend.
      # (Sigue como variable: cambia a menudo y `up -d backend` debe recogerla.)
      RFAF_COOKIE: ${RFAF_COOKIE:-}
    secrets:
      - db_password
      - jwt_secret
      - aes_secret_key
      - seed_admin_password
    volumes:
      # migrate.js busca database/migrations en la raíz del contenedor
      # (../../../database/migrations desde backend/src/utils); sin este
      # mount, database/migrations/*.sql nunca se aplican en Docker.
      - ./database/migrations:/database/migrations:ro
    expose:
      - "4000"
    # Sano = responde /health (wget de busybox, ya viene en node:alpine). Margen
    # al arrancar para las migraciones. `docker ps` lo marca "unhealthy" si se cuelga.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    networks:
      - apr_net

  # Tests del backend en Docker: solo con el profile "test" (antes se
  # arrancaba con cada `docker compose up` y dejaba apr_backend_test parado).
  #   docker compose --env-file .env.development --profile test run --rm test
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: apr_backend_test
    logging: *logging
    restart: "no"
    profiles:
      - test
    command: npm test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atletico_palma_intranet}
      DB_USER: ${DB_USER:-apr_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
    cap_drop:
      - ALL
    networks:
      - apr_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: apr_frontend
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Solo en localhost por defecto: en el servidor se entra por el reverse
    # proxy HTTPS. Para probar desde otro dispositivo de la red local,
    # FRONTEND_BIND=0.0.0.0 en el env file.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - apr_net

  # HTTPS público con Let's Encrypt, sin depender de Cloudflare: este nginx
  # atiende 80/443 y reenvía todo a "frontend" (que ya hace de proxy interno
  # hacia el backend). Ver reverse-proxy/init-letsencrypt.sh para el primer
  # certificado; luego el servicio "certbot" los renueva solo.
  reverse-proxy:
    # nginx:alpine + apk upgrade (reverse-proxy/Dockerfile).
    build: ./reverse-proxy
    container_name: apr_reverse_proxy
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:-intranet.atleticopalmadelrio.com}
    volumes:
      - ./reverse-proxy/templates:/etc/nginx/templates:ro
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt:ro
      - ./reverse-proxy/certbot/www:/var/www/certbot:ro
      # Log de acceso en fichero para fail2ban (lee los intentos de login).
      - ./reverse-proxy/logs:/var/log/apr
    networks:
      - apr_net

  # Sin versión fija a propósito: la actualiza el script de parches de los
  # viernes (scripts/comprobar-parches-docker.sh), y si la renovación se rompe
  # avisa el monitor de GitHub 14 días antes de que caduque el certificado.
  certbot:
    image: certbot/certbot
    container_name: apr_certbot
    logging: *logging
    mem_limit: 256m
    restart: unless-stopped
    # Solo lo que necesita para escribir el certificado y el reto webroot:
    # algunas carpetas de reverse-proxy/certbot son del usuario ubuntu.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt
      - ./reverse-proxy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - apr_net

  # fail2ban: banea por el cortafuegos del host (iptables) las IPs con abuso
  # sostenido de login/2FA (leyendo el access.log del reverse-proxy) y de SSH.
  # Como el reverse-proxy es un contenedor, el baneo del login se inserta en la
  # cadena DOCKER-USER (por donde pasa el tráfico 80/443 hacia el contenedor);
  # el de SSH va a INPUT. Necesita la red del host y NET_ADMIN para tocar el
  # cortafuegos del host, así que solo tiene sentido en el EC2 (Linux): va en el
  # profile "seguridad" para no arrancar en el `docker compose up` de desarrollo.
  # Arrancar en el EC2 con:  docker compose --env-file .env.development --profile seguridad up -d fail2ban
  fail2ban:
    image: crazymax/fail2ban:1.1.0
    container_name: apr_fail2ban
    logging: *logging
    mem_limit: 256m
    restart: unless-stopped
    profiles:
      - seguridad
    # Red del host: para que su iptables actúe sobre el cortafuegos del host.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Madrid
      F2B_DB_PURGE_AGE: 7d
    volumes:
      # Config (jail.d/filter.d) y base de datos de baneos de fail2ban.
      - ./reverse-proxy/fail2ban/data:/data
      # Log de acceso del reverse-proxy (login/2FA) en solo lectura.
      - ./reverse-proxy/logs:/var/log/apr:ro
      # Log de autenticación del host para el jail sshd (solo lectura).
      - /var/log/auth.log:/var/log/auth.log:ro

# Secretos: salen de las variables del env file (--env-file) y cada servicio
# los recibe como fichero en /run/secrets/<nombre>, no como variable de
# entorno. Al cambiar uno, recrear con --force-recreate los servicios que lo
# usan (compose no detecta solo el cambio de valor).
secrets:
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  db_password:
    environment: DB_PASSWORD
  binlog_password:
    environment: BINLOG_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  aes_secret_key:
    environment: AES_SECRET_KEY
  seed_admin_password:
    environment: SEED_ADMIN_PASSWORD

volumes:
  apr_mysql_data:

networks:
  apr_net:
    driver: bridge

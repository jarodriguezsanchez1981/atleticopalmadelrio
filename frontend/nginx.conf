server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS interno de Docker + proxy_pass con variable: nginx vuelve a resolver
    # "backend" cada 10s. Con el nombre fijo en proxy_pass solo lo resolvía al
    # arrancar y, si el backend se recreaba con otra IP, devolvía 502 hasta
    # recargar nginx a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

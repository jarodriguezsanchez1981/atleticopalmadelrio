# Tope de peticiones a /health (este nginx, en producción, solo ve la IP del
# reverse-proxy, así que el límite por IP de verdad va en el reverse-proxy; aquí
# solo se frena una riada al endpoint de estado, que no pasa por el rate limit
# de /api del backend). En local, sin reverse-proxy, sí ve la IP real.
limit_req_zone $binary_remote_addr zone=apr_health:1m rate=5r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cortafuegos básico de carga: cuerpo máximo (coherente con el límite de
    # 2 MB del backend, con holgura para las fotos en base64) y timeouts para
    # que una conexión lenta (slowloris) no retenga un worker indefinidamente.
    client_max_body_size 4m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    # DNS interno de Docker + proxy_pass con variable: nginx vuelve a resolver
    # "backend" cada 10s. Con el nombre fijo en proxy_pass solo lo resolvía al
    # arrancar y, si el backend se recreaba con otra IP, devolvía 502 hasta
    # recargar nginx a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        # Cabeceras de respuesta grandes (cookie de sesión + cabeceras de seguridad):
        # con el búfer por defecto (4 KB) nginx devolvía 502 en el login.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        # Si el backend no responde a tiempo, cortar en vez de acumular esperas.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health {
        limit_req zone=apr_health burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

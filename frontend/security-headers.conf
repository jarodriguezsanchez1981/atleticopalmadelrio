# Cabeceras de seguridad para lo que sirve nginx directamente (HTML y assets).
# Las respuestas de /api ya las lleva el backend (helmet), por eso este fichero
# se incluye solo en las location estáticas: add_header no se hereda en una
# location que define los suyos propios.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP ajustada a lo que usa la SPA:
#   - script-src 'self': el build no tiene scripts inline ni usa eval.
#   - style-src 'unsafe-inline' + fonts.googleapis: PrimeVue inyecta estilos en
#     runtime y las fuentes Inter/Manrope vienen de Google Fonts.
#   - font-src gstatic + data: las fuentes y algún icono embebido.
#   - img-src data: y blob: para los escudos en base64, los QR y los PDF.
#   - frame-src blob: la vista previa del PDF (Invitación Torneo) es un iframe blob:.
#   - worker-src blob: jsPDF/html2canvas pueden usar workers.
#   - connect-src 'self': la API va bajo el mismo origen (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

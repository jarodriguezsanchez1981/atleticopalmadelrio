# Cabeceras de seguridad para lo que sirve nginx directamente (HTML y assets).
# Las respuestas de /api ya las lleva el backend (helmet), por eso este fichero
# se incluye solo en las location estáticas: add_header no se hereda en una
# location que define los suyos propios.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
